[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "conduct"
version = "0.1.0"
description = "Test how your system behaves"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api>=1.44,<2", "opentelemetry-sdk>=1.44,<2"]

[project.urls]
Repository = "https://github.com/neil-gilbert/conduct"
Issues = "https://github.com/neil-gilbert/conduct/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/conduct"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
